# Builds an installable Android APK (debug-signed) from the Orbit web app.
# Put this file at:  .github/workflows/build-android-apk.yml
#
# Run it:  GitHub repo -> Actions -> "Build Android APK" -> Run workflow
# Result:  download "Orbit-apk" from the run's Artifacts (unzip -> Orbit.apk)
# Tip:     push a tag like v1.0.0 and the APK is also attached to a GitHub Release.

name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: Orbit
  APP_ID: com.sethil.orbit
  # Folder in your repo that holds index.html, manifest.json, sw.js and the icons.
  # "." means the repository root. Change it if the app lives in a sub-folder.
  WEB_DIR: .

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Collect the web app files
        run: |
          SRC="$WEB_DIR"
          if [ ! -f "$SRC/index.html" ]; then
            FOUND=$(grep -rl --include=manifest.json '"Orbit"' . 2>/dev/null | head -1 || true)
            if [ -n "$FOUND" ]; then SRC=$(dirname "$FOUND"); echo "Auto-detected app folder: $SRC"; fi
          fi
          echo "Repository contents:"; ls -la
          echo "Using app folder: $SRC"; ls -la "$SRC"
          if [ ! -f "$SRC/index.html" ]; then
            echo "::error::index.html not found. Set WEB_DIR (top of this file) to the folder that contains index.html"
            exit 1
          fi
          mkdir -p capapp/www
          for f in index.html manifest.json sw.js favicon.ico favicon.svg icon-32.png icon-192.png icon-512.png; do
            if [ -f "$SRC/$f" ]; then cp "$SRC/$f" capapp/www/; else echo "skipping missing $f"; fi
          done
          ls -la capapp/www

      - name: Create the Capacitor Android project
        working-directory: capapp
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Allow the camera (QR scanner and receipt scan)
        working-directory: capapp
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$MANIFEST"
          grep -n "CAMERA" "$MANIFEST"

      - name: Use the Orbit app icon
        working-directory: capapp
        run: |
          if ! command -v convert > /dev/null; then
            sudo apt-get update && sudo apt-get install -y imagemagick
          fi
          if [ -f www/icon-512.png ]; then
            RES=android/app/src/main/res
            rm -rf "$RES/mipmap-anydpi-v26"
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              n="${d%%:*}"; s="${d##*:}"
              convert www/icon-512.png -resize "${s}x${s}" "$RES/mipmap-$n/ic_launcher.png"
              cp "$RES/mipmap-$n/ic_launcher.png" "$RES/mipmap-$n/ic_launcher_round.png"
            done
          else
            echo "icon-512.png not found - keeping the default icon"
          fi

      - name: Set the app version
        working-directory: capapp
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build the APK
        working-directory: capapp/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          cp capapp/android/app/build/outputs/apk/debug/app-debug.apk "$APP_NAME.apk"
          ls -la "$APP_NAME.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v6
        with:
          name: Orbit-apk
          path: Orbit.apk
          if-no-files-found: error

      - name: Attach the APK to a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: Orbit.apk
